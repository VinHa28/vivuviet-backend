services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vivuviet-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # Thêm networks nếu bạn muốn backend và frontend giao tiếp nội bộ tốt hơn
    networks:
      - vivuviet-network

networks:
  vivuviet-network:
    driver: bridge
